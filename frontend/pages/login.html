<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universo Literario — Iniciar Sesión</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="auth-page">
  <main class="auth-card" aria-labelledby="auth-heading">
    <div class="auth-logo" aria-hidden="true">📚</div>
    <h1 class="auth-title" id="auth-heading">Universo Literario</h1>
    <p class="auth-subtitle">Panel de Administración Corporativa</p>

    <div id="error-msg" class="alert alert-error hidden" role="alert"></div>

    <form onsubmit="return false;">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" placeholder="admin" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="login-btn">Iniciar Sesión</button>
    </form>
  </main>
  <script src="../js/auth.js"></script>
</body>
</html>
