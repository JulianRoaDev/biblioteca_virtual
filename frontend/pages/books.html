<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestionar Libros — Universo Literario</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <header>
    <nav class="navbar" aria-label="Navegación principal">
      <div class="nav-brand">📚 Universo Literario</div>
      <div class="nav-links">
        <a href="dashboard.html" class="nav-link">Inicio</a>
        <a href="books.html" class="nav-link active" aria-current="page">Gestionar Libros</a>
        <a href="upload.html" class="nav-link">Subir Libro</a>
        <button class="btn btn-outline btn-sm" id="logout-btn">Cerrar Sesión</button>
      </div>
      <button class="nav-toggle" id="nav-toggle" aria-label="Abrir menú de navegación">☰</button>
    </nav>
  </header>

  <main class="container">
    <div class="page-header">
      <h2>Gestionar Libros</h2>
      <a href="upload.html" class="btn btn-primary">+ Nuevo Libro</a>
    </div>

    <div class="search-bar">
      <label for="search-input" class="sr-only" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;">Buscar por título o autor</label>
      <input type="text" id="search-input" placeholder="🔍 Buscar por título o autor..." />
    </div>

    <div class="books-table-wrapper">
      <table class="books-table">
        <caption>Catálogo de publicaciones registradas</caption>
        <thead>
          <tr>
            <th scope="col">Portada</th>
            <th scope="col">Título</th>
            <th scope="col">Autor</th>
            <th scope="col">Fecha de Publicación</th>
            <th scope="col">Acciones</th>
          </tr>
        </thead>
        <tbody id="books-tbody">
          <tr><td colspan="5" class="loading-text">Cargando libros...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal de edición -->
  <div class="modal-overlay hidden" id="edit-modal" role="dialog" aria-labelledby="modal-title" aria-modal="true">
    <div class="modal">
      <h3 id="modal-title">Editar Libro</h3>
      <input type="hidden" id="edit-id" />
      <div class="form-group">
        <label for="edit-title">Título</label>
        <input type="text" id="edit-title" />
      </div>
      <div class="form-group">
        <label for="edit-author">Autor</label>
        <input type="text" id="edit-author" />
      </div>
      <div class="form-group">
        <label for="edit-date">Fecha de Publicación</label>
        <input type="date" id="edit-date" />
      </div>
      <div class="form-group">
        <label for="edit-synopsis">Sinopsis</label>
        <textarea id="edit-synopsis" rows="4"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="modal-cancel">Cancelar</button>
        <button class="btn btn-primary" id="modal-save">Guardar Cambios</button>
      </div>
    </div>
  </div>

  <script src="../js/books.js"></script>
</body>
</html>
